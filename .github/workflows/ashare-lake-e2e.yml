name: CNEquity real data lake E2E

on:
  push:
    branches: [main]
    paths:
      - 'integrations/ashare_quant/e2e_validate_lake.py'
      - 'integrations/ashare_quant/test_e2e_validate_lake.py'
      - '.github/workflows/ashare-lake-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnequity-real-demo-e2e
  cancel-in-progress: false

jobs:
  real-lake-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CNE_LANG: en
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checked-out CNEquity fork
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m compileall -q integrations/ashare_quant/e2e_validate_lake.py
      - name: Test readback quality gates offline
        run: python -m unittest discover -s integrations/ashare_quant -p 'test_*.py' -v
      - name: Ingest genuine daily bars into isolated local lake
        id: ingest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ashare-e2e"
          set -o pipefail
          cne init --profile demo \
            --symbols 600519.SH,000001.SZ \
            --days 90 \
            --trade-date 2026-11-04 \
            --data-root "$RUNNER_TEMP/ashare-e2e/lake" \
            --config-out "$RUNNER_TEMP/ashare-e2e/demo.toml" \
            2>&1 | tee "$RUNNER_TEMP/ashare-e2e/ingestion.log"
      - name: Reopen lake and independently validate curated data
        if: steps.ingest.outcome == 'success'
        shell: bash
        run: |
          python integrations/ashare_quant/e2e_validate_lake.py \
            --data-root "$RUNNER_TEMP/ashare-e2e/lake" \
            --expected-symbols 600519.SH,000001.SZ \
            --target-date 2026-11-04 \
            --min-sessions 60 \
            --output "$RUNNER_TEMP/ashare-e2e/readback.json"
          cat "$RUNNER_TEMP/ashare-e2e/readback.json"
      - name: Emit failure summary when source ingestion fails
        if: failure() && steps.ingest.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ashare-e2e"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ashare-e2e"
          report = {
              "status": "INGESTION_FAILED_NO_READBACK",
              "target_date": "2026-11-04",
              "requested_symbols": ["600519.SH", "000001.SZ"],
              "provider_live_bars_verified": False,
              "historical_universe_approved": False,
              "strategy_approved": False,
              "errors": ["REAL_DEMO_INGESTION_FAILED"],
              "note": "Inspect ingestion.log; no valid market data confirmation.",
          }
          (root / "readback.json").write_text(json.dumps(report, indent=2))
          PY
      - name: Summarize actual data verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "ashare-e2e" / "readback.json"
          lines = ["## CNEquity real lake E2E",
                   "Target close: **2026-11-04**",
                   "Scope: 600519.SH, 000001.SZ (demo only; not full market)"]
          if not path.exists():
              lines.append("Result: **NO REPORT** — inspect failed installation or unit-test step")
          else:
              report = json.loads(path.read_text())
              lines.append("Result: **" + str(report.get("status", "UNKNOWN")) + "**")
              lines.append("Actual real bars verified: **" +
                           str(report.get("provider_live_bars_verified", False)) + "**")
              coverage = report.get("coverage", {})
              for symbol, item in sorted(coverage.items()):
                  lines.append("- " + symbol + ": bars=" +
                               str(item.get("bars", "?")) + ", last=" +
                               str(item.get("last", "?")) + ", missing sessions=" +
                               str(item.get("missing_recent_session_count", "?")))
              blockers = report.get("strategy_blockers", [])
              errors = report.get("errors", [])
              lines.append("Errors: " + (", ".join(errors) if errors else "none"))
              lines.append("Strategy blockers: " +
                           (", ".join(blockers) if blockers else "demo scope not strategy-approved"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\\n".join(lines) + "\\n")
          PY
      - name: Upload E2E diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnequity-real-demo-e2e-report
          path: |
            ${{ runner.temp }}/ashare-e2e/readback.json
            ${{ runner.temp }}/ashare-e2e/ingestion.log
          if-no-files-found: warn
          retention-days: 7
